plugins {
	id 'spacebod.fabric'
}

apply from: rootProject.file('llama.gradle')

dependencies {
	// Dev runs load the binding straight from its jar; the release jar has it copied in (llama.gradle).
	localRuntime "net.ladenthin:llama:${project.llama_version}"
	include "com.fasterxml.jackson.core:jackson-databind:${project.jackson_version}"
	include "com.fasterxml.jackson.core:jackson-core:${project.jackson_version}"
	include "com.fasterxml.jackson.core:jackson-annotations:${project.jackson_annotations_version}"
}

// Dev client only: a fixed 16 GB heap.
loom {
	runs {
		client {
			vmArg '-Xms16G'
			vmArg '-Xmx16G'
		}
	}
}
