org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Mod
mod_id=spacebod_herald
mod_version=0.1.0
group=dev.spacebod

# Minecraft: the everyday dev target. release-matrix.ps1 overrides this and every version below it per series.
minecraft_version=26.2
# Vanilla Minecraft for compiling common/: https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2

# Fabric: https://fabricmc.net/develop
loader_version=0.19.5
fabric_api_version=0.160.0+26.2
modmenu_version=20.0.2

# NeoForge: https://projects.neoforged.net/neoforged/neoforge
neoforge_version=26.2.0.88

# Both loaders (optional config screen)
cloth_config_version=26.2.155

# On-device writer: llama.cpp JNI binding (https://central.sonatype.com/artifact/net.ladenthin/llama) and its JSON library
llama_version=5.1.0
jackson_version=2.22.2
# Since 2.20, jackson-annotations drops the patch number.
jackson_annotations_version=2.22

# Tests: https://junit.org
junit_version=5.14.4
