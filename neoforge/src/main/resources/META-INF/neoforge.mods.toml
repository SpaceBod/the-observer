modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/SpaceBod/the-observer/issues"

[[mods]]
modId = "spacebod_observer"
version = "${version}"
displayName = "The Observer"
displayURL = "https://github.com/SpaceBod/the-observer"
${icon}File = "assets/spacebod_observer/icon.png"
${icon}Blur = false
authors = "SpaceBod"
description = '''The AI newspaper for your Minecraft world: every week a language model on your own computer writes up what your world's players actually did, and the Pawstman delivers it to your door.'''

[[mixins]]
config = "spacebod_observer.mixins.json"

[[dependencies.spacebod_observer]]
modId = "neoforge"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.spacebod_observer]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
ordering = "NONE"
side = "BOTH"
