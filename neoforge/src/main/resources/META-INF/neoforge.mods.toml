modLoader = "javafml"
loaderVersion = "[1,)"
license = "MIT"
issueTrackerURL = "https://github.com/SpaceBod/herald/issues"

[[mods]]
modId = "spacebod_herald"
version = "${version}"
displayName = "Herald"
