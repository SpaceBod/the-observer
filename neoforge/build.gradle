plugins {
	id 'spacebod.neoforge'
}

apply from: rootProject.file('llama.gradle')

dependencies {
	// Dev runs load the binding straight from its jar; the release jar has it copied in (llama.gradle).
	runtimeOnly("net.ladenthin:llama:${project.llama_version}") { transitive = false }
	jarJar "com.fasterxml.jackson.core:jackson-databind:${project.jackson_version}"
	jarJar "com.fasterxml.jackson.core:jackson-core:${project.jackson_version}"
	jarJar "com.fasterxml.jackson.core:jackson-annotations:${project.jackson_annotations_version}"
}

// Dev client only: the same player every run, so the world remembers them.
neoForge {
	runs {
		client {
			programArguments.addAll('--username', 'Reader')
			// -Pworld=<name>: straight into that singleplayer world.
			if (project.hasProperty('world')) {
				programArguments.addAll('--quickPlaySingleplayer', project.property('world'))
			}
		}
	}
}
